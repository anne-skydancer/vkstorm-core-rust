[package]
name = "vkstorm-image"
description = "Raster image codecs for Vulkanstorm other than JPEG 2000: PNG, JPEG, TGA, BMP and DXT behind the viewer's LLImageFormatted contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# PNG: chunk parsing, unfiltering and inflate (fdeflate); the viewer's libpng
# transformations (expand, gray to RGB, tRNS, strip 16, gamma) are applied here.
png = { version = "0.18", default-features = false }
# PNG encoding deflates with zlib-rs, the Rust port of zlib-ng (the deflate the
# viewer's libpng links), at libpng's settings.
zlib-rs = "0.6"
# The JPEG candidate (feature `jpeg`): measured against libjpeg-turbo and not
# adopted by the viewer (see the viewer's doc/rust_port.md). Decoding is
# zune-jpeg (SIMD IDCT, upsampling and colour conversion on x86), encoding
# jpeg-encoder (AVX2 forward DCT and colour conversion).
zune-jpeg = { version = "0.5", optional = true }
jpeg-encoder = { version = "0.7", features = ["simd"], optional = true }

[features]
default = []
jpeg = ["dep:zune-jpeg", "dep:jpeg-encoder"]
