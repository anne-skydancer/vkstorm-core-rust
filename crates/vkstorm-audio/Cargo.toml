[package]
name = "vkstorm-audio"
description = "The viewer's audio engine for Vulkanstorm: the sound-effect mixer (voices, 3D positioning, attenuation, Doppler, wind), the output device, sound asset decoding and in-process parcel music streaming with fades and speaker fill, replacing SoLoud and the VLC music path"
version.workspace = true
edition.workspace = true
# The mixer is derived from SoLoud (zlib; LICENSE-soloud).
license = "LGPL-2.1-only AND Zlib"
repository.workspace = true

[features]
default = []
# The stream module calls libcurl through its exported symbols. The
# viewer's FFI crate enables this (the viewer links its prebuilt libcurl).
# Without it nothing in the crate references libcurl, so test binaries
# link without one (stream::set_curl_api can supply the entry points).
curl-symbols = []
# Link libcurl from the build environment (the crate's own tests and
# benches). The viewer links its prebuilt libcurl into the executable.
link-curl = ["curl-symbols", "dep:vkstorm-http", "vkstorm-http/link-curl"]

[dependencies]
vkstorm-vorbis = { path = "../vkstorm-vorbis" }
# Only for link-curl: its build script names libcurl for the linker.
vkstorm-http = { path = "../vkstorm-http", optional = true }
# Parcel music decoders (src/stream): MPEG audio layers 1-3, AAC-LC, FLAC.
# Pure Rust, MPL-2.0. Vorbis is vkstorm-vorbis; HE-AAC and Opus go through
# FFmpeg, loaded at run time with libloading.
symphonia-core = "=0.6.1"
symphonia-bundle-mp3 = "=0.6.1"
symphonia-codec-aac = "=0.6.1"
symphonia-bundle-flac = "=0.6.1"
libloading = "=0.9.0"

# The output device on Windows (src/device/wasapi.rs): COM, MMDevice
# enumeration and notifications, WASAPI shared-mode rendering. On Linux the
# device loads libpulse/libasound at run time through libloading above.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "=0.62.2"

[dev-dependencies]

[[bench]]
name = "mixer"
harness = false

[[example]]
name = "render_music"
required-features = ["link-curl"]
