[package]
name = "vkstorm-j2c"
description = "JPEG 2000 texture decoding and encoding for Vulkanstorm on the vkstorm-openjp2 port, behind the viewer codec contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vkstorm-openjp2 = { path = "../vkstorm-openjp2", default-features = false, features = ["std"] }

[features]
guard-alloc = ["vkstorm-openjp2/guard-alloc"]
