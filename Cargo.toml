[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# Not Rust packages: the fixture generator drivers for vkstorm-llsd and
# vkstorm-inventory.
exclude = ["tools/llsd-fixtures", "tools/inventory-fixtures"]

[workspace.package]
version = "0.5.3"
edition = "2024"
# GPL-3.0-or-later (NOTICE.md): the crates port Linden Lab and Firestorm code
# (LGPL-2.1, used under the GPL) or are original; a vendored port that keeps
# its own licence says so in its own Cargo.toml.
license = "GPL-3.0-or-later"
repository = "https://github.com/anne-skydancer/vkstorm-core-rust"

[workspace.dependencies]
# vkstorm-http's reply decoding: flate2 on zlib-rs (pure Rust, the Zlib
# licence; flate2 is MIT OR Apache-2.0), CPU features detected at run time.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
hayro-jpeg2000 = "0.4"
j2k = "0.12"

# The static library shipped to the viewer (packaging/build_package.py): the
# viewer's Release configuration links with LTO, so the library does too.
# Panics are caught at the C boundary, so line tables are enough for traces.
[profile.ffi-package]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = "line-tables-only"
